<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>后里家收費登記</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#5b6475; --brand:#1a6ed8; --ok:#18794e; --warn:#b54708; --bad:#b42318; --line:#dfe3ea; --chip:#eef2f8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.5 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:560px; margin:0 auto; padding:14px 14px 80px; }
  h1 { font-size:22px; margin:6px 0 2px; }
  h2 { font-size:19px; margin:0 0 8px; }
  .sub { color:var(--muted); font-size:15px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .hidden { display:none !important; }
  button, .btn { display:block; width:100%; padding:15px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-size:19px; font-weight:600; text-align:center; margin-top:10px; cursor:pointer; }
  button.sec, .btn.sec { background:#e8eefb; color:var(--brand); }
  button.bad { background:#fde8e6; color:var(--bad); }
  button.small { width:auto; display:inline-block; padding:8px 12px; font-size:15px; margin:0; }
  button:disabled { opacity:.45; }
  input[type=text], input[type=password], input[type=date], input[type=number], select { width:100%; padding:12px; border:1px solid #c9cfda; border-radius:10px; font-size:18px; background:#fff; }
  label.f { display:block; font-size:15px; color:var(--muted); margin:10px 0 4px; }
  .seg { display:flex; gap:8px; }
  .seg button, .chips button, .grid button { margin:0; }
  .seg button { flex:1; background:var(--chip); color:var(--text); padding:12px; }
  .seg button.on { background:var(--brand); color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chips button { width:auto; padding:10px 14px; background:var(--chip); color:var(--text); font-size:17px; font-weight:500; }
  .chips button.on { background:var(--brand); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:6px; }
  .grid button { background:var(--chip); color:var(--text); padding:11px 6px; font-size:16px; font-weight:500; }
  .grid button.on { background:var(--brand); color:#fff; }
  .line { border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; background:#fbfcfe; }
  .msg { margin-top:10px; padding:10px 12px; border-radius:10px; background:#eef2f8; font-size:16px; }
  .msg.ok { background:#e4f5ec; color:var(--ok); } .msg.warn { background:#fdf1e2; color:var(--warn); } .msg.bad { background:#fde8e6; color:var(--bad); }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .sticky { position:sticky; bottom:0; background:var(--bg); padding:8px 0 calc(8px + env(safe-area-inset-bottom)); }
  body.wide main { max-width:none; }
  #rep-wrap { overflow-x:auto; padding-bottom:20px; }
  .rp { background:#fff; color:#000; margin:12px auto; box-shadow:0 1px 8px rgba(0,0,0,.18); padding:8mm; box-sizing:border-box;
        font-family:"DFKai-SB","BiauKai","標楷體","Noto Serif TC",serif; font-size:11pt; line-height:1.35; }
  .rp-land { width:297mm; } .rp-port { width:210mm; }
  .rp-title { text-align:center; font-size:18pt; font-weight:700; }
  .rp-title2 { text-align:center; font-size:16pt; font-weight:700; margin:2mm 0 3mm; }
  .rp-period { font-weight:700; margin-bottom:2px; } .rp-period span { font-weight:400; margin-left:12px; }
  table.rp-t { width:100%; border-collapse:collapse; border:2px solid #000; font-size:10.5pt; table-layout:auto; }
  .rp-t th, .rp-t td { border:1px solid #000; padding:2px 4px; } .rp-t th { font-weight:700; text-align:center; }
  .rp-t td.c { text-align:center; } .rp-t td.r { text-align:right; } .rp-t .b { font-weight:700; }
  .rp-total td { font-weight:700; border-top:2px solid #000; }
  .rp-legend td { border-top:0; padding:6px; text-align:left; font-size:11pt; }
  .rp-sign { display:flex; gap:70mm; margin:12mm 0 0 30mm; font-weight:700; font-size:12pt; }
  .rp-band { background:#dbe8f5; } .rp-cat td { background:#e8f0fa; } .rp-band2 { background:#fbe2d5; } .rp-calc td { background:#fdeee6; }
  .rp-t .neg { color:#c00000; }
  .rp-box { display:flex; gap:4px; align-items:flex-start; font-size:11pt; cursor:pointer; } .rp-box input { width:18px; height:18px; margin-top:2px; }
  .rp-foot td { vertical-align:top; height:20mm; }
  .rp-t thead { display:table-header-group; } .rp-t tr { page-break-inside:avoid; }
  @page land { size:A4 landscape; margin:7mm; }
  @page port { size:A4 portrait; margin:7mm; }
  .rp-land { page:land; } .rp-port { page:port; page-break-after:always; }
  @media print {
    body { background:#fff; }
    main { max-width:none; padding:0; }
    main > section:not(#v-reports) { display:none !important; }
    .noprint { display:none !important; }
    #rep-wrap { overflow:visible; padding:0; }
    .rp { margin:0; box-shadow:none; padding:0; }
    .rp-land { width:auto; } .rp-port { width:auto; }
  }
  .hc-row { display:flex; gap:12px; margin-top:10px; } .hc-row > div { flex:1; }
  .hc-n { font-size:24px; font-weight:700; }
  #o-body { max-width:1100px; }
  .ov-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:12px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .kpi .l { font-size:14px; color:var(--muted); } .kpi .v { font-size:28px; font-weight:700; margin-top:2px; line-height:1.2; }
  .kpi.warn { background:#fdf1e2; border-color:#f1d3a8; } .kpi.warn .v { color:var(--warn); }
  .kpi.ok .v { color:var(--ok); } .kpi.bad { background:#fde8e6; border-color:#f3b8b2; } .kpi.bad .v { color:var(--bad); }
  .ov-two { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-bottom:12px; }
  .ov-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; overflow-x:auto; }
  .ov-card h3 { margin:0 0 10px; font-size:18px; }
  .ov-t { width:100%; border-collapse:collapse; font-size:16px; min-width:560px; }
  .ov-t th { text-align:right; font-size:14px; font-weight:500; color:var(--muted); padding:6px 8px; border-bottom:2px solid var(--line); }
  .ov-t th:first-child, .ov-t td:first-child { text-align:left; }
  .ov-t td { text-align:right; padding:9px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .ov-t .neg { color:var(--bad); font-weight:700; } .ov-t .pos { font-weight:700; }
  .ov-t .flag { display:inline-block; margin-left:6px; background:#fde8e6; color:var(--bad); border-radius:8px; padding:1px 8px; font-size:13px; font-weight:500; }
  .ov-t tr.staff td { color:var(--muted); }
  .cb { display:grid; grid-template-columns:96px 1fr 120px; gap:10px; align-items:center; margin:7px 0; font-size:16px; }
  .cb .bar { height:14px; background:var(--chip); border-radius:7px; overflow:hidden; } .cb .bar i { display:block; height:100%; background:#1a6ed8; border-radius:7px; }
  .cb .a { text-align:right; font-variant-numeric:tabular-nums; } .cb .a span { color:var(--muted); font-size:13px; margin-left:6px; }
  .trend { display:flex; align-items:flex-end; gap:14px; height:190px; padding-top:8px; }
  .trend .col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:44px; }
  .trend .stack { width:100%; max-width:56px; display:flex; flex-direction:column; justify-content:flex-end; border-radius:6px 6px 0 0; overflow:hidden; }
  .trend .stack i { display:block; } .trend .tp { background:#1a6ed8; } .trend .ts { background:#8fd0c6; }
  .trend .lab { font-size:13px; color:var(--muted); margin-top:6px; } .trend .num { font-size:12px; color:var(--text); margin-bottom:3px; }
  .legend { display:flex; gap:16px; font-size:14px; color:var(--muted); margin-top:10px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .tbl { width:100%; border-collapse:collapse; margin-top:10px; font-size:17px; }
  .tbl th { text-align:left; font-size:14px; color:var(--muted); font-weight:500; padding:4px 6px; border-bottom:1px solid var(--line); }
  .tbl td { padding:8px 6px; border-bottom:1px solid var(--line); }
  .tbl .r { text-align:right; }
  .tbl .sumrow td { font-weight:700; border-top:2px solid var(--line); border-bottom:0; }
  .tag { display:inline-block; background:#FFF1DC; color:#8A4B00; border-radius:8px; padding:1px 8px; font-size:13px; font-weight:500; }
  .rec { border-bottom:1px solid var(--line); padding:8px 0; font-size:16px; }
  .rec .t { color:var(--muted); font-size:14px; }
  .big { font-size:30px; font-weight:700; }
  #video-wrap { position:relative; margin-top:10px; } video { width:100%; border-radius:12px; background:#000; }
  .hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; color:#fff; text-shadow:0 1px 3px #000; font-size:17px; }
  input[type=file] { display:none; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .link { background:none; color:var(--muted); font-size:14px; width:auto; padding:6px; margin:0; font-weight:400; text-decoration:underline; }
</style>
</head>
<body>
<main>

<!-- 登入 -->
<section id="v-login" class="hidden">
  <h1>后里家收費登記</h1>
  <p class="sub">請輸入通關密碼</p>
  <div class="card">
    <input id="pass" type="password" placeholder="通關密碼" autocomplete="current-password">
    <label class="f"><input id="remember" type="checkbox" checked> 在這支手機記住密碼</label>
    <button id="btn-login">進入</button>
    <div id="login-msg" class="msg hidden"></div>
  </div>
</section>

<!-- 首頁 -->
<section id="v-home" class="hidden">
  <div class="top"><h1>后里家收費登記</h1><button class="link" id="btn-logout">登出</button></div>
  <p class="sub" id="home-sub"></p>
  <button id="btn-scan">📷 掃發票</button>
  <button id="btn-manual" class="sec">✏️ 手動記一筆（沒有發票或掃不出來）</button>
  <button id="btn-records" class="sec">📋 看本月紀錄</button>
  <button id="btn-reports" class="sec">🖨 產出報表（列印／存成 PDF）</button>
  <button id="btn-overview" class="sec">📊 總覽（月底核對用）</button>
  <div class="card" id="home-card" style="margin-top:14px">
    <div class="sub" id="hc-title" style="margin:0">本月已登記</div>
    <div class="hc-row">
      <div><div class="hc-n" id="hc-n">–</div><div class="sub" style="margin:0">筆</div></div>
      <div><div class="hc-n" id="hc-s" style="color:#0b6e5f">–</div><div class="sub" style="margin:0">共用</div></div>
      <div><div class="hc-n" id="hc-p" style="color:var(--brand)">–</div><div class="sub" style="margin:0">個人</div></div>
    </div>
  </div>
</section>

<!-- 掃描 -->
<section id="v-scan" class="hidden">
  <h1>掃發票</h1>
  <div class="card">
    <button id="btn-cam">打開鏡頭</button>
    <div id="video-wrap" class="hidden"><video id="video" playsinline muted></video><div class="hint">對準發票左邊的 QR code</div></div>
    <label class="btn sec" for="file">鏡頭打不開？改用拍照</label>
    <input id="file" type="file" accept="image/*" capture="environment">
    <div id="scan-msg" class="msg">按「打開鏡頭」開始。</div>
    <button id="btn-go" class="hidden">不掃右邊了，直接登記</button>
  </div>
  <button id="btn-scan-back" class="sec">返回</button>
</section>

<!-- 登記 -->
<section id="v-edit" class="hidden">
  <h1 id="edit-title">登記</h1>
  <div class="card">
    <label class="f">日期</label><input id="e-date" type="date">
    <label class="f">購買地點</label><input id="e-place" type="text" placeholder="例如：全聯、7-11" maxlength="60">
    <div id="e-invoice" class="sub" style="margin-top:8px"></div>
  </div>
  <div id="e-lines"></div>
  <div class="row" style="gap:8px">
    <button id="btn-addline" class="sec">＋ 再加一列（拆開）</button>
    <button id="btn-splititems" class="sec hidden">依發票品項拆開</button>
  </div>
  <div class="sticky">
    <div id="e-sum" class="msg"></div>
    <button id="btn-save">存起來</button>
    <button id="btn-edit-back" class="sec">取消</button>
  </div>
</section>

<!-- 完成 -->
<section id="v-done" class="hidden">
  <div class="card">
    <h2>✅ 已儲存</h2>
    <p>請把序號寫在紙本發票上：</p>
    <div class="big" id="done-serials"></div>
    <div id="done-note" class="sub"></div>
  </div>
  <button id="btn-again">再掃一張</button>
  <button id="btn-done-home" class="sec">回首頁</button>
</section>

<!-- 紀錄 -->
<section id="v-records" class="hidden">
  <div class="top"><h1>登記紀錄</h1></div>
  <div class="row" style="margin:6px 0">
    <button class="small sec" id="p-prev">◀</button>
    <b id="p-label"></b>
    <button class="small sec" id="p-next">▶</button>
  </div>
  <div class="card" id="rec-sum"></div>
  <div class="card" id="rec-list"></div>
  <button id="btn-rec-back" class="sec">返回首頁</button>
</section>

<!-- 總覽 -->
<section id="v-overview" class="hidden">
  <div class="top"><h1>總覽</h1><button class="link" id="o-back">返回首頁</button></div>
  <div class="row" style="margin:8px 0 12px;max-width:420px">
    <button class="small sec" id="o-prev">◀</button><b id="o-label" style="font-size:20px"></b><button class="small sec" id="o-next">▶</button>
  </div>
  <div id="o-body"></div>
</section>

<!-- 報表 -->
<section id="v-reports" class="hidden">
  <div class="noprint">
    <h1>產出報表</h1>
    <div class="card">
      <div class="row"><button class="small sec" id="r-prev">◀</button><b id="r-label"></b><button class="small sec" id="r-next">▶</button></div>
      <label class="f">要印哪一份</label>
      <div class="seg" id="r-kinds">
        <button data-rk="shared">共用清單</button><button data-rk="personal">個人購物清單</button><button data-rk="summary">支出明細表</button>
      </div>
      <div id="r-whowrap"><label class="f">哪一位住民</label><select id="r-who"></select></div>
      <label class="f">表頭顯示</label>
      <select id="r-mode"><option value="code">代號（A、B…）</option><option value="name">姓名</option></select>
      <div id="r-checks" style="margin-top:10px"></div>
      <button id="r-print">列印／另存為 PDF</button>
      <p class="sub" style="margin:8px 0 0">在列印視窗：目的地選「另存為 PDF」可存檔；紙張選 <b>A4</b>；勾選「背景圖形」。個人購物清單要先在畫面上勾好下方三個選項再列印。</p>
    </div>
    <button id="r-back" class="sec">返回首頁</button>
  </div>
  <div id="rep-wrap"><div id="rep-out"></div></div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="config.js"></script>
<script src="parser.js"></script>
<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
